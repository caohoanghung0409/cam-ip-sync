name: Build Android APK

on:
  workflow_dispatch: # Cho phép bấm nút Build thủ công bất cứ lúc nào

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Skeleton
        run: |
          # Khởi tạo các file Android nền tảng còn thiếu
          flutter create . --platforms=android --org com.camsync

          # Cấp quyền INTERNET và cho phép kết nối HTTP nội bộ
          sed -i 's/<application/<uses-permission android:name="android.intent.permission.INTERNET"\/>\n    <uses-permission android:name="android.intent.permission.ACCESS_NETWORK_STATE"\/>\n    <application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Camera-Sync-App
          path: build/app/outputs/flutter-apk/app-release.apk
