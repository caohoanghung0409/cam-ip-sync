name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.3'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Initialize App & Setup TSMH Icon Cleanly
        run: |
          pip install pillow

          # 1. Khởi tạo project Flutter
          flutter create noiday --org com.noiday --platforms android
          cd noiday

          # 2. Thêm thư viện cần thiết
          flutter pub add http
          flutter pub add --dev flutter_launcher_icons

          # 3. Đổi tên ứng dụng thành NỔI DẬY và cấp quyền mạng
          sed -i 's/android:label=".*"/android:label="NỔI DẬY"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<uses-permission android:name="android.intent.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml

          # 4. Tạo ảnh nguồn icon TSMH chất lượng cao 512x512 (Đỏ Ruby & Vàng Gold)
          python3 -c "
          from PIL import Image, ImageDraw
          import os

          sz = 512
          img = Image.new('RGBA', (sz, sz), color=(0, 0, 0, 0))
          draw = ImageDraw.Draw(img)

          # Nền bo góc Đỏ Ruby
          corner = 110
          draw.rounded_rectangle([(0, 0), (sz - 1, sz - 1)], radius=corner, fill=(139, 0, 0, 255))

          # Khung viền kim cương đôi mạ vàng Gold 24K
          draw.polygon([(256, 40), (472, 256), (256, 472), (40, 256)], outline=(255, 215, 0, 255), width=8)
          draw.polygon([(256, 56), (456, 256), (256, 456), (56, 256)], outline=(255, 248, 220, 200), width=4)

          # 4 đỉnh ngọc vàng
          for pt in [(256, 24), (256, 488), (24, 256), (488, 256)]:
              draw.ellipse([(pt[0]-10, pt[1]-10), (pt[0]+10, pt[1]+10)], fill=(255, 215, 0, 255))

          # Chữ T (Góc trên - trái)
          draw.line([(150, 150), (220, 150)], fill=(255, 215, 0, 255), width=14)
          draw.line([(185, 150), (185, 220)], fill=(255, 215, 0, 255), width=14)

          # Chữ S (Góc trên - phải)
          draw.arc([(300, 140), (360, 185)], start=160, end=380, fill=(255, 255, 255, 255), width=14)
          draw.arc([(300, 175), (360, 225)], start=-20, end=200, fill=(255, 255, 255, 255), width=14)

          # Chữ M (Góc dưới - trái)
          draw.line([(150, 360), (150, 290)], fill=(255, 255, 255, 255), width=14)
          draw.line([(150, 290), (185, 335)], fill=(255, 255, 255, 255), width=14)
          draw.line([(185, 335), (220, 290)], fill=(255, 255, 255, 255), width=14)
          draw.line([(220, 290), (220, 360)], fill=(255, 255, 255, 255), width=14)

          # Chữ H (Góc dưới - phải)
          draw.line([(300, 290), (300, 360)], fill=(255, 215, 0, 255), width=14)
          draw.line([(360, 290), (360, 360)], fill=(255, 215, 0, 255), width=14)
          draw.line([(300, 325), (360, 325)], fill=(255, 215, 0, 255), width=14)

          # Đường chỉ chia chữ thập vàng
          draw.line([(256, 170), (256, 342)], fill=(255, 215, 0, 140), width=4)
          draw.line([(170, 256), (342, 256)], fill=(255, 215, 0, 140), width=4)

          os.makedirs('assets', exist_ok=True)
          img.save('assets/icon.png')
          print('Created TSMH PNG icon successfully!')
          "

          # 5. Cấu hình flutter_launcher_icons để tự động sinh icon tương thích hoàn toàn
          cat << 'EOF' >> pubspec.yaml

          flutter_launcher_icons:
            android: "launcher_icon"
            image_path: "assets/icon.png"
            min_sdk_android: 21
          EOF

          flutter pub run flutter_launcher_icons

          # 6. Chép file main.dart từ repo
          cp ../lib/main.dart lib/main.dart

          # 7. Build file APK chuẩn
          flutter build apk --release --no-tree-shake-icons

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Noi-Day-App
          path: noiday/build/app/outputs/flutter-apk/app-release.apk
