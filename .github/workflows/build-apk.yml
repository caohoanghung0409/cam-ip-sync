name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.3'

      - name: Initialize and Build App
        run: |
          # 1. Tạo project chuẩn
          flutter create noiday --org com.noiday --platforms android
          cd noiday

          # 2. Thêm thư viện cần thiết
          flutter pub add http

          # 3. Đặt tên hiển thị app là NỔI DẬY và cấp quyền INTERNET
          sed -i 's/android:label=".*"/android:label="NỔI DẬY"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<uses-permission android:name="android.intent.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml

          # 4. Sao chép file main.dart vào project
          cp ../lib/main.dart lib/main.dart

          # 5. Kiểm tra cú pháp trước khi build
          flutter analyze || true

          # 6. Build file APK phát hành
          flutter build apk --release --no-tree-shake-icons

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Noi-Day-App
          path: noiday/build/app/outputs/flutter-apk/app-release.apk
