name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build APK Clean
        run: |
          # 1. Tạo project Flutter sạch độc lập
          flutter create noiday_app --org com.noiday

          # 2. Đổi tên ứng dụng thành NỔI DẬY
          sed -i 's/android:label=".*"/android:label="NỔI DẬY"/' noiday_app/android/app/src/main/AndroidManifest.xml

          # 3. Chép code giao diện của bạn vào project mới
          cp lib/main.dart noiday_app/lib/main.dart

          # 4. Chuyển vào thư mục và build APK
          cd noiday_app
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Noi-Day-App
          path: noiday_app/build/app/outputs/flutter-apk/app-release.apk
