name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.3'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Initialize App & Setup Sharp TSMH Icon
        run: |
          pip install pillow

          flutter create noiday --org com.noiday --platforms android
          cd noiday

          flutter pub add http
          flutter pub add --dev flutter_launcher_icons

          sed -i 's/android:label=".*"/android:label="NỔI DẬY"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<uses-permission android:name="android.intent.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml

          # Tạo ảnh PNG icon TSMH với chữ S uốn lượn sắc sảo
          python3 -c "
          from PIL import Image, ImageDraw
          import os

          sz = 512
          img = Image.new('RGBA', (sz, sz), color=(0, 0, 0, 0))
          draw = ImageDraw.Draw(img)

          # Nền đỏ Ruby bo góc
          corner = 110
          draw.rounded_rectangle([(0, 0), (sz - 1, sz - 1)], radius=corner, fill=(139, 0, 0, 255))

          # Khung kim cương mạ vàng Gold 24K
          draw.polygon([(256, 40), (472, 256), (256, 472), (40, 256)], outline=(255, 215, 0, 255), width=8)
          draw.polygon([(256, 58), (454, 256), (256, 454), (58, 256)], outline=(255, 248, 220, 200), width=4)

          # 4 đỉnh ngọc
          for pt in [(256, 24), (256, 488), (24, 256), (488, 256)]:
              draw.ellipse([(pt[0]-10, pt[1]-10), (pt[0]+10, pt[1]+10)], fill=(255, 215, 0, 255))

          # Trục phân cách chữ thập mạ vàng
          draw.line([(256, 160), (256, 352)], fill=(255, 215, 0, 140), width=4)
          draw.line([(160, 256), (352, 256)], fill=(255, 215, 0, 140), width=4)

          # Chữ T (Vàng Gold)
          draw.line([(145, 150), (225, 150)], fill=(255, 215, 0, 255), width=15)
          draw.line([(185, 150), (185, 225)], fill=(255, 215, 0, 255), width=15)

          # Chữ S chuẩn nét (Trắng Bạc Silver)
          s_pts = [
              (362, 152), (322, 144), (298, 162),
              (300, 185), (330, 200), (362, 214),
              (364, 236), (336, 254), (296, 246)
          ]
          for i in range(len(s_pts) - 1):
              draw.line([s_pts[i], s_pts[i+1]], fill=(255, 255, 255, 255), width=15)
          for pt in s_pts:
              draw.ellipse([(pt[0]-7, pt[1]-7), (pt[0]+7, pt[1]+7)], fill=(255, 255, 255, 255))

          # Chữ M (Trắng Bạc Silver)
          draw.line([(145, 362), (145, 290)], fill=(255, 255, 255, 255), width=15)
          draw.line([(145, 290), (185, 335)], fill=(255, 255, 255, 255), width=15)
          draw.line([(185, 335), (225, 290)], fill=(255, 255, 255, 255), width=15)
          draw.line([(225, 290), (225, 362)], fill=(255, 255, 255, 255), width=15)

          # Chữ H (Vàng Gold)
          draw.line([(295, 290), (295, 362)], fill=(255, 215, 0, 255), width=15)
          draw.line([(365, 290), (365, 362)], fill=(255, 215, 0, 255), width=15)
          draw.line([(295, 326), (365, 326)], fill=(255, 215, 0, 255), width=15)

          os.makedirs('assets', exist_ok=True)
          img.save('assets/icon.png')
          print('Successfully generated sharp TSMH icon!')
          "

          # Tạo file cấu hình riêng độc lập để tránh lỗi thụt lề YAML
          cat << 'EOF' > flutter_launcher_icons.yaml
          flutter_launcher_icons:
            android: "launcher_icon"
            image_path: "assets/icon.png"
            min_sdk_android: 21
          EOF

          dart run flutter_launcher_icons

          cp ../lib/main.dart lib/main.dart

          flutter build apk --release --no-tree-shake-icons

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Noi-Day-App
          path: noiday/build/app/outputs/flutter-apk/app-release.apk
