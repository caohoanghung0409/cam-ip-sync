name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Android Structure
        run: |
          # Xóa thư mục android cũ nếu có để tránh xung đột
          rm -rf android
          # Tạo lại thư mục android chuẩn
          flutter create . --platforms=android --org com.noiday

          # Cập nhật tên app thành NỔI DẬY nếu file tồn tại
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            sed -i 's/android:label="[^"]*"/android:label="NỔI DẬY"/' android/app/src/main/AndroidManifest.xml || true
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Noi-Day-App
          path: build/app/outputs/flutter-apk/app-release.apk
