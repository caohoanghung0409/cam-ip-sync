name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.3'

      - name: Initialize and Build App
        run: |
          # 1. Tạo project chuẩn mới
          flutter create noiday --org com.noiday --platforms android

          # 2. Đổi tên ứng dụng hiển thị ngoài màn hình thành NỔI DẬY
          sed -i 's/android:label=".*"/android:label="NỔI DẬY"/' noiday/android/app/src/main/AndroidManifest.xml

          # 3. Ghi đè file main.dart bằng file trong repo
          cp lib/main.dart noiday/lib/main.dart

          # 4. Di chuyển vào thư mục và build
          cd noiday
          flutter pub get
          flutter analyze || true
          flutter build apk --release --no-tree-shake-icons

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Noi-Day-App
          path: noiday/build/app/outputs/flutter-apk/app-release.apk
