name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.3'

      - name: Set up Python & Fonts
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Initialize and Generate NOI DAY Icon
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
          pip install pillow

          flutter create noiday --org com.noiday --platforms android
          cd noiday
          flutter pub add http

          sed -i 's/android:label=".*"/android:label="NỔI DẬY"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<uses-permission android:name="android.intent.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml

          cp ../lib/main.dart lib/main.dart

          # Tạo icon chữ NỔI DẬY chất lượng cao
          python3 -c "
          from PIL import Image, ImageDraw, ImageFont
          import os

          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192
          }

          font_path = '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'

          for folder, sz in sizes.items():
              target_dir = os.path.join('android/app/src/main/res', folder)
              os.makedirs(target_dir, exist_ok=True)
              img = Image.new('RGBA', (sz, sz), color=(0, 0, 0, 0))
              draw = ImageDraw.Draw(img)

              corner = int(sz * 0.22)
              # Nền đỏ đậm sang trọng
              draw.rounded_rectangle([(0, 0), (sz - 1, sz - 1)], radius=corner, fill=(198, 40, 40, 255))
              # Viền vàng kim
              draw.rounded_rectangle([(1, 1), (sz - 2, sz - 2)], radius=corner, outline=(255, 215, 0, 230), width=max(1, int(sz*0.03)))

              f_sz = max(8, int(sz * 0.23))
              try:
                  font = ImageFont.truetype(font_path, f_sz)
              except Exception:
                  font = ImageFont.load_default()

              t1, t2 = 'NOI', 'DAY'
              b1 = draw.textbbox((0, 0), t1, font=font)
              b2 = draw.textbbox((0, 0), t2, font=font)

              w1, h1 = b1[2] - b1[0], b1[3] - b1[1]
              w2, h2 = b2[2] - b2[0], b2[3] - b2[1]

              spacing = int(sz * 0.05)
              total_h = h1 + h2 + spacing
              y_start = (sz - total_h) / 2 - int(sz * 0.03)

              draw.text(((sz - w1) / 2, y_start), t1, fill=(255, 235, 59, 255), font=font)
              draw.text(((sz - w2) / 2, y_start + h1 + spacing), t2, fill=(255, 255, 255, 255), font=font)

              img.save(os.path.join(target_dir, 'ic_launcher.png'))
          print('Successfully generated NOI DAY icons!')
          "

          flutter build apk --release --no-tree-shake-icons

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Noi-Day-App
          path: noiday/build/app/outputs/flutter-apk/app-release.apk
