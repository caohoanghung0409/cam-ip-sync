name: Build and Deploy Flutter Web App

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.3'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Initialize Web Project & Assets
        run: |
          pip install pillow

          # Tạo project Flutter hỗ trợ Web
          flutter create noiday --org com.noiday --platforms web
          cd noiday
          flutter pub add http

          # Sao chép code logic chính của app
          cp ../lib/main.dart lib/main.dart

          # Tạo Icon PWA chuẩn TSMH viền vàng nền đỏ ruby
          python3 -c "
          from PIL import Image, ImageDraw
          import os

          sz = 512
          img = Image.new('RGB', (sz, sz), color=(139, 0, 0))
          draw = ImageDraw.Draw(img)

          # Khung viền bát giác vàng
          draw.polygon([(256, 40), (472, 256), (256, 472), (40, 256)], outline=(255, 215, 0), width=8)
          draw.polygon([(256, 58), (454, 256), (256, 454), (58, 256)], outline=(255, 248, 220), width=4)

          # 4 điểm nhấn
          for pt in [(256, 24), (256, 488), (24, 256), (488, 256)]:
              draw.ellipse([(pt[0]-10, pt[1]-10), (pt[0]+10, pt[1]+10)], fill=(255, 215, 0))

          # Trục la bàn
          draw.line([(256, 160), (256, 352)], fill=(255, 215, 0), width=4)
          draw.line([(160, 256), (352, 256)], fill=(255, 215, 0), width=4)

          # T
          draw.line([(145, 150), (225, 150)], fill=(255, 215, 0), width=15)
          draw.line([(185, 150), (185, 225)], fill=(255, 215, 0), width=15)

          # S
          s_pts = [(362, 152), (322, 144), (298, 162), (300, 185), (330, 200), (362, 214), (364, 236), (336, 254), (296, 246)]
          for i in range(len(s_pts)-1):
              draw.line([s_pts[i], s_pts[i+1]], fill=(255, 255, 255), width=15)
          for pt in s_pts:
              draw.ellipse([(pt[0]-7, pt[1]-7), (pt[0]+7, pt[1]+7)], fill=(255, 255, 255))

          # M
          draw.line([(145, 362), (145, 290)], fill=(255, 255, 255), width=15)
          draw.line([(145, 290), (185, 335)], fill=(255, 255, 255), width=15)
          draw.line([(185, 335), (225, 290)], fill=(255, 255, 255), width=15)
          draw.line([(225, 290), (225, 362)], fill=(255, 255, 255), width=15)

          # H
          draw.line([(295, 290), (295, 362)], fill=(255, 215, 0), width=15)
          draw.line([(365, 290), (365, 362)], fill=(255, 215, 0), width=15)
          draw.line([(295, 326), (365, 326)], fill=(255, 215, 0), width=15)

          os.makedirs('web/icons', exist_ok=True)
          img.save('web/icons/Icon-192.png')
          img.save('web/icons/Icon-512.png')
          img.save('web/icons/Icon-maskable-192.png')
          img.save('web/icons/Icon-maskable-512.png')
          img.save('web/favicon.png')
          img.save('web/apple-touch-icon.png')
          "

          # Cấu hình PWA Manifest để cài đặt toàn màn hình trên iOS / Android
          cat << 'EOF' > web/manifest.json
          {
            "name": "NỔI DẬY",
            "short_name": "NỔI DẬY",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#0f172a",
            "theme_color": "#8b0000",
            "description": "Lịch trực thứ Bảy TSMH",
            "orientation": "portrait-primary",
            "prefer_related_applications": false,
            "icons": [
              {
                "src": "icons/Icon-192.png",
                "sizes": "192x192",
                "type": "image/png"
              },
              {
                "src": "icons/Icon-512.png",
                "sizes": "512x512",
                "type": "image/png"
              }
            ]
          }
          EOF

          # Cấu hình thẻ meta Apple PWA trong index.html
          sed -i 's/<title>.*<\/title>/<title>NỔI DẬY<\/title>/' web/index.html
          sed -i 's/<\/head>/  <meta name="apple-mobile-web-app-capable" content="yes">\n  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">\n  <meta name="apple-mobile-web-app-title" content="NỔI DẬY">\n  <link rel="apple-touch-icon" href="apple-touch-icon.png">\n<\/head>/' web/index.html

          # Build Flutter Web với đường dẫn base href chuẩn repo
          flutter build web --base-href "/cam-ip-sync/" --release

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './noiday/build/web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
